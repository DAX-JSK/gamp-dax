<title>공정분석 AI 화면설계</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: control-room shell — fixed nav tree left, screen header, 3-column panel grid of the mock screen */
:root{
 --bg:#EEF2F3; --surface:#FFFFFF; --sunk:#F6F8F9; --ink:#14212B; --muted:#5A6B77; --faint:#8B9AA5; --line:#D9E1E6;
 --accent:#0B6E79; --accent-ink:#FFFFFF; --accent-soft:#DDEFF0;
 --ok:#24794A; --ok-s:#E1F2E7; --wn:#A86A12; --wn-s:#FBEFD9; --cr:#B8322A; --cr-s:#F8E1DE; --in:#2F65A0; --in-s:#E0EAF5; --ai:#6A48B5; --ai-s:#ECE6F8; --mu:#7A8790; --mu-s:#ECEFF1;
 --chart1:#0B6E79; --chart2:#C2701C; --chart3:#6A48B5; --grid:#E4EAEE;
 --steel1:#E3E9ED; --steel2:#C5CFD6; --steel3:#F4F7F9; --steel-line:#7C8C97;
 --f-ui:"IBM Plex Sans","IBM Plex Sans KR","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
 --nav-w:300px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0F171C; --surface:#162128; --sunk:#111B21; --ink:#E3EAEE; --muted:#9AAAB4; --faint:#6E7F8A; --line:#26343D;
 --accent:#3DB3BF; --accent-ink:#06191C; --accent-soft:#163A3F;
 --ok:#5CC488; --ok-s:#173327; --wn:#E3A64A; --wn-s:#3A2C14; --cr:#F07D72; --cr-s:#3D1E1B; --in:#7EAEE3; --in-s:#1A2B3E; --ai:#B39BF0; --ai-s:#2A2244; --mu:#93A1AA; --mu-s:#222E35;
 --chart1:#3DB3BF; --chart2:#E59A4C; --chart3:#B39BF0; --grid:#22303A; --steel1:#2A3841; --steel2:#1E2A31; --steel3:#36464F; --steel-line:#8A9BA6; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0F171C; --surface:#162128; --sunk:#111B21; --ink:#E3EAEE; --muted:#9AAAB4; --faint:#6E7F8A; --line:#26343D;
 --accent:#3DB3BF; --accent-ink:#06191C; --accent-soft:#163A3F;
 --ok:#5CC488; --ok-s:#173327; --wn:#E3A64A; --wn-s:#3A2C14; --cr:#F07D72; --cr-s:#3D1E1B; --in:#7EAEE3; --in-s:#1A2B3E; --ai:#B39BF0; --ai-s:#2A2244; --mu:#93A1AA; --mu-s:#222E35;
 --chart1:#3DB3BF; --chart2:#E59A4C; --chart3:#B39BF0; --grid:#22303A; --steel1:#2A3841; --steel2:#1E2A31; --steel3:#36464F; --steel-line:#8A9BA6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:flex;flex-direction:column;height:100%}
.gnb{display:flex;align-items:stretch;gap:18px;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none}
.gnb .brand{border:0;padding:10px 0;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 14px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap}
.tab small{font:11px var(--f-mono);color:var(--faint)}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.gnb .chip{align-self:center}
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);flex:1;min-height:0}
.app.nonav{grid-template-columns:minmax(0,1fr)}.app.nonav .nav{display:none}
.navh{padding:14px 16px 4px;font-size:15px;font-weight:600}
.navh small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
/* nav */
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 12px var(--f-mono)}
.brand b{font-weight:600;font-size:14px;display:block}.brand small{color:var(--muted);font-size:11.5px}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.tree{overflow:auto;padding:6px 0 24px;flex:1}
.sub:first-child{padding-top:10px}
.grp>button{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%;box-sizing:border-box;padding:9px 16px 5px;font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{padding:6px 16px 2px 16px;font-size:12px;color:var(--faint);font-weight:500}
.item{display:flex;gap:8px;align-items:baseline;padding:4px 16px 4px 22px;color:var(--ink);text-decoration:none;font-size:13px;border-left:3px solid transparent}
.item code{font:11px var(--f-mono);color:var(--faint);min-width:72px}
.item:hover{background:var(--sunk)}
.item.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:500}
.item.on code{color:var(--accent)}
.grp.closed .body{display:none}
/* main */
.main{overflow:auto;min-width:0}
.top{position:sticky;top:0;min-height:42px;z-index:5;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.menu{display:none;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:5px 10px}
.crumb{color:var(--muted);font-size:12.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);background:var(--sunk);white-space:nowrap}
.wrap{padding-block:20px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1360px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:14px}
.head h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.head .id{font:500 13px var(--f-mono);color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.pager{margin-left:auto;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spec{border:1px solid var(--line);border-radius:8px;background:var(--sunk);margin-bottom:16px}
.spec summary{cursor:pointer;padding:8px 14px;font-size:12.5px;color:var(--muted)}
.spec dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px;margin:0;padding:4px 14px 12px;font-size:13px}
.spec dt{color:var(--faint);font-size:12px}.spec dd{margin:0}
/* mock frame */
.frame{border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.fbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.fbar .scr{font-weight:600;color:var(--ink)}
.fbar .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}
.pn{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column}
.s2{grid-column:span 2}.s3{grid-column:1/-1}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h3{margin:0;font-size:13px;font-weight:600;flex:1;min-width:120px}
.pb{padding:10px 12px;min-width:0}
.pb.flush{padding:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
.filters span{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 8px;font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:first-child td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td:first-child{font-family:var(--f-mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:500;white-space:nowrap;font-family:var(--f-ui)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok);background:var(--ok-s)}.wn{color:var(--wn);background:var(--wn-s)}.cr{color:var(--cr);background:var(--cr-s)}.in{color:var(--in);background:var(--in-s)}.ai{color:var(--ai);background:var(--ai-s)}.mu{color:var(--mu);background:var(--mu-s)}
/* form */
.fm{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr);gap:7px 10px;align-items:center;font-size:12.5px}
.fm label{color:var(--muted)}
.fld{border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--surface);min-height:28px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;overflow-wrap:anywhere}
.fld.ro{background:var(--sunk);color:var(--muted)}
.fld.area{min-height:46px;align-items:flex-start}
.fld .car{color:var(--faint);font-size:10px}
.chk{display:flex;align-items:center;gap:7px}.chk i{width:14px;height:14px;border-radius:3px;background:var(--accent);display:inline-block}
.pf{display:flex;gap:6px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot{font-size:11.5px;color:var(--faint);padding:0 12px 10px}
/* kv */
.kv{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr);gap:6px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line)}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px;position:relative}
.kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--c,var(--line))}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.kpi .u{font-size:11.5px;color:var(--faint)}
/* steps */
.steps{display:flex;gap:0;overflow-x:auto;padding:12px}
.st{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12px;color:var(--muted);text-align:center}
.st::after{content:"";position:absolute;top:11px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--line)}
.st:last-child::after{display:none}
.st i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 11px var(--f-mono);font-style:normal;background:var(--surface)}
.st.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.st.done::after{background:var(--accent)}
.st.cur i{border-color:var(--accent);color:var(--accent)}.st.cur{color:var(--ink);font-weight:600}
/* tree */
.tr{font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.tr div{padding:3px 6px;border-radius:4px;display:flex;gap:6px}
.tr div.on{background:var(--accent-soft);font-weight:500}
.tr span.b{color:var(--faint);font-family:var(--f-mono)}
.note{display:flex;gap:10px;font-size:12.5px;color:var(--muted);padding:10px 12px;align-items:flex-start}
.note::before{content:"i";flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--in);color:var(--in);display:grid;place-items:center;font:600 11px var(--f-mono)}
/* log, code */
.log{font:12px/1.6 var(--f-mono);overflow-x:auto;white-space:pre;padding:10px 12px;background:var(--sunk)}
.log .t{color:var(--faint)}.lv-INFO{color:var(--in)}.lv-WARN{color:var(--wn)}.lv-ERROR{color:var(--cr)}.lv-OK{color:var(--ok)}
pre.code{margin:0;font:12px/1.55 var(--f-mono);padding:12px;background:var(--sunk);overflow-x:auto}
.api{display:flex;flex-direction:column}
.api div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.api div:last-child{border-bottom:0}
.api b{font:600 11px var(--f-mono);padding:2px 0;border-radius:4px;text-align:center;align-self:start}
.api code{font:12.5px var(--f-mono);overflow-wrap:anywhere}.api span{grid-column:2;color:var(--muted)}
.m-GET{color:var(--in);background:var(--in-s)}.m-POST{color:var(--ok);background:var(--ok-s)}.m-DELETE{color:var(--cr);background:var(--cr-s)}
/* sign */
.sig{display:flex;flex-direction:column;gap:8px}
.sig .meaning{font-size:12.5px}.sig .meaning b{color:var(--accent)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;border-top:3px solid var(--c)}
.card b{font-size:13px;font-weight:600}.card span{font-size:12px;color:var(--muted)}
/* flow */
.flow{display:flex;gap:0;overflow-x:auto;padding:14px 12px}
.fn{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px;position:relative;padding-right:22px}
.fn::after{content:"";position:absolute;right:6px;top:22px;width:10px;height:10px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}
.fn:last-child::after{display:none}
.fn .bx{border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:7px;padding:8px 10px}
.fn .bx b{display:block;font-size:12.5px}.fn .bx span{font:11.5px var(--f-mono);color:var(--muted)}
.fn small{font-size:11.5px;color:var(--muted);padding-left:2px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:12px}
.msg{max-width:88%;padding:9px 12px;border-radius:10px;font-size:13px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--sunk);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg .cite{display:block;margin-top:6px;font:11.5px var(--f-mono);color:var(--ai)}
.chatin{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.chatin .fld{flex:1;color:var(--faint)}
/* advice */
.adv{border-left:4px solid var(--ai);background:var(--ai-s);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.adv .tag{font:600 11px var(--f-mono);color:var(--ai);letter-spacing:.06em}
.adv p{margin:0;font-size:13.5px}.adv small{color:var(--muted);font-size:12px}
/* doc */
.doc{background:var(--sunk);padding:14px}
.page{background:var(--surface);border:1px solid var(--line);padding:18px 22px;max-width:640px;margin:auto;font-size:12.5px;display:flex;flex-direction:column;gap:10px}
.page h4{margin:0;font-size:12.5px}.page p{margin:2px 0 0;color:var(--muted)}
.page mark{background:var(--ai-s);color:var(--ai);padding:0 3px;border-radius:3px;font-size:11px}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slide{aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:8px;font-size:11.5px;display:flex;flex-direction:column;gap:6px}
.slide i{flex:1;border-radius:3px;background:linear-gradient(transparent 60%,var(--accent-soft) 60%),var(--sunk)}
.check{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.check div{display:flex;gap:8px;align-items:center}
.check b{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:11px;flex:none}
/* matrix */
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left;font-family:var(--f-ui)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent)}.dot.no{background:transparent;border:1.5px solid var(--line)}
/* sliders */
.sl{display:flex;flex-direction:column;gap:12px;font-size:12.5px}
.sl label{display:flex;justify-content:space-between;color:var(--muted)}.sl label b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.sl input{width:100%;accent-color:var(--accent)}
.out{margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline}
.out b{font-size:22px;font-weight:600}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font:10.5px var(--f-ui)}
.prev{white-space:pre-wrap;font:12px/1.6 var(--f-mono);background:var(--sunk);padding:12px;border-radius:0 0 8px 8px}
/* query bar */
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.qt{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.qf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;min-width:0}
.qf > span:first-child{font-weight:500;color:var(--ink)}
.qf select,.qf input{border:1px solid var(--line);border-radius:5px;padding:4px 8px;background:var(--surface);font-size:12.5px;color:var(--ink);max-width:100%;font-variant-numeric:tabular-nums}
.qf select:hover,.qf input:hover{border-color:var(--accent)}
.qmeta{font-size:11.5px;color:var(--faint)}
.qchips{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center}
.qchip{display:inline-flex;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 2px 1px 9px;font-size:12px;font-variant-numeric:tabular-nums}
.qchip button{all:unset;cursor:pointer;padding:0 6px;font-size:13px;line-height:1}
.qchip button:focus-visible{outline:2px solid var(--accent);border-radius:50%}
.qbtns{margin-left:auto;display:flex;gap:6px}
@media (max-width:860px){.qbtns{margin-left:0}}
/* icons */
.icocell{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
td:has(.icocell){padding-block:4px;width:44px}
.ilib{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.itile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink);font-size:12px;text-align:center;position:relative}

   g += `<rect x="${x}" y="${f.Y(Math.max(y0, y1))}" width="${bw - 12}" height="${Math.abs(f.Y(y0) - f.Y(y1))}" fill="${c}" rx="2"/><text x="${x + (bw - 12) / 2}" y="${f.Y(Math.max(y0, y1)) - 4}" text-anchor="middle">${tot ? v.toFixed(1) : (v > 0 ? "+" : "") + v}</text><text x="${x + (bw - 12) / 2}" y="${H - B + 14}" text-anchor="middle">${esc(l.split(" ")[0] + (l.split(" ")[1] && !tot ? " " + l.split(" ")[1] : ""))}</text>`; });

 fbgT(o, r){
  const n = 90, phase = i => i < 10 ? 34 + i * .9 : i < 62 ? 35 + Math.sin(i / 9) * .6 : 35 + (i - 62) * .55;

  const f = frame(0, n - 1, 30, 52, {yl: o.y, xl: "분", xt: [[0,"0"],[10,"10"],[56,"56 (현재)"],[89,"90"]]}); let g = f.g;
  [[0,10,"예열"],[10,62,"분무 과립"],[62,89,"건조 (예측)"]].forEach(([a, b, l], k) => g += `<rect x="${f.X(a)}" y="${T}" width="${f.X(b) - f.X(a)}" height="${H - T - B}" fill="${k === 1 ? "var(--in-s)" : "var(--sunk)"}" opacity=".7"/><text x="${f.X(a) + 4}" y="${T + 11}">${l}</text>`);
  g += `<path d="${path(m.slice(0, 57), f.X, f.Y)}" fill="none" stroke="var(--chart1)" stroke-width="1.8"/><path d="${path(tw, f.X, f.Y)}" fill="none" stroke="var(--ai)" stroke-width="1.6" stroke-dasharray="${"5 3"}"/>`;
  g += `<line x1="${f.X(56)}" x2="${f.X(56)}" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-dasharray="2 3"/>`;
  return legend(["품온 실측 (TI-02)", "트윈 (현재 이후는 예측)"], ["var(--chart1)", "var(--ai)"]) + svg(g);
 },
 fbgLOD(o, r){
  const n = 90, lod = i => i < 10 ? 2.5 : i < 62 ? 2.5 + (i - 10) * .33 : Math.max(1.8, 19.6 * Math.exp(-(i - 62) / 9));

function fbgSVG(){

 for (let k = 0; k < 26; k++) { const x = 275 + r() * 90, y = 235 + r() * 70; pts += `<circle class="pt up" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.6 + r() * 1.6).toFixed(1)}" style="animation-delay:-${(r() * 2.4).toFixed(2)}s;--dy:-${(10 + r() * 30).toFixed(0)}px"/>`; }
 let bags = ""; for (let k = 0; k < 5; k++) { const x = 247 + k * 30; bags += `<rect x="${x}" y="60" width="20" height="78" rx="9" class="bag"/><line x1="${x + 10}" y1="60" x2="${x + 10}" y2="136" class="seam"/>`; }

 const panels = sp.p.map((p, k) => { const s = p.s || (p.t === "steps" ? 3 : 1); const body = PN[p.t](p, f.id + k); const showHead = !["kpi","steps","note"].includes(p.t) || p.h;
  return `<section class="pn ${s === 2 ? "s2" : s === 3 ? "s3" : ""}">${showHead && (p.h || p.btns) ? `<div class="ph"><h3>${esc(tx(p.h || ""))}</h3>${["form","sign","kv","tree"].includes(p.t) ? "" : btns(p.btns)}${p.t === "chart" && p.live ? '<span class="pill ok">실시간</span>' : ""}${p.k === "pi" || p.k === "anom" || p.t === "advice" ? '<span class="pill ai">AI</span>' : ""}</div>` : ""}${body}${(p.t === "form" || p.t === "kv" || p.t === "tree") && p.btns ? `<div class="pf">${foot(p.btns)}</div>` : ""}</section>`; }).join("");
 return `<div class="head"><div><div class="id">${f.id} · ${esc(sp.en)}${f.note.includes("Savvy") ? " · ★ Savvy 벤치마킹" : ""}</div><h1>${esc(f.ko)}</h1></div><div class="tags"><span class="pill ${tc}">${tl}</span><span class="chip">${f.pri}</span></div>
 <div class="pager">${prev ? `<a class="btn" href="#${prev.id}">← ${prev.id}</a>` : ""}${next ? `<a class="btn" href="#${next.id}">${next.id} →</a>` : ""}</div></div>
 <details class="spec"><summary>기능정의서 v0.2 참조</summary><dl><dt>세부기능</dt><dd>${esc(f.ko)}</dd><dt>기능 설명</dt><dd>${esc(f.desc)}</dd><dt>주요 입출력</dt><dd>${esc(f.io || "—")}</dd><dt>GxP</dt><dd>${esc(f.gxp || "—")}</dd>${f.note ? `<dt>비고</dt><dd>${esc(f.note)}</dd>` : ""}</dl></details>
 <div class="frame"><div class="fbar"><span class="scr">${esc(MID[f.mid])} › ${esc(SUB[f.sub])} › ${esc(f.ko)}</span><span class="sp"></span><span>s.park (MSAT)</span><span>·</span><span>2026-11-02 14:25 KST</span></div>${qbar(f)}<div class="grid">${panels}</div></div>`;
}
const tabs = document.getElementById("tabs"), appEl = document.getElementById("app"), navh = document.getElementById("navh"), qEl = document.getElementById("q");
const view = document.getElementById("view"), crumb = document.getElementById("crumb"), tree = document.getElementById("tree"), nav = document.getElementById("nav");
function route(){
 const id = location.hash.slice(1), f = byId[id];
 const mod = f ? f.mid : null;
 if (mod !== curMod) { curMod = mod; qEl.value = ""; tree.innerHTML = navHTML(); }
 tabs.innerHTML = tabsHTML(); appEl.classList.toggle("nonav", !curMod);
 if (curMod) { const fs = FEAT.filter(x => x.mid === curMod); navh.innerHTML = `${esc(MID[curMod])}<small>화면 ${fs.length}개 · 소분류 ${new Set(fs.map(x => x.sub)).size}개</small>`; }
 const ot = tabs.querySelector(".tab.on"); if (ot) ot.scrollIntoView({block: "nearest", inline: "nearest"});
 view.innerHTML = f ? screen(f) : home();
 crumb.innerHTML = f ? `${esc(MID[f.mid])} › ${esc(SUB[f.sub])} › <b>${esc(f.ko)}</b>` : `<b>전체 화면 · ${FEAT.length}개</b>`;
 tree.querySelectorAll(".item").forEach(a => a.classList.toggle("on", a.dataset.id === id));
 const on = tree.querySelector(".item.on"); if (on) on.scrollIntoView({block: "nearest"});
 document.getElementById("main").scrollTop = 0; nav.classList.remove("open"); wireSim(); wireIcons(); wireTwin(); wireQuery();
}
function wireSim(){
 const ins = view.querySelectorAll(".sl input"); if (!ins.length) return;
 const upd = () => { const v = [...ins].map(i => +i.value); ins.forEach((i, k) => document.getElementById("slv" + k).textContent = (+i.value).toFixed(k === 1 ? 0 : 2) + " " + i.dataset.u);
  const d = 98.2 - 121 * v[0] - .08 * v[1] + 2.6 * v[2] - 1.2 * (v[3] - 2.4) - 7.1; document.getElementById("simout").textContent = d.toFixed(1) + " µm";
  const z = Math.min((65 - d) / 3, (d - 45) / 3), p = 1 / (1 + Math.exp(-1.7 * z)); const el = document.getElementById("simp"); el.textContent = p.toFixed(2); el.style.color = p < .9 ? "var(--cr)" : "var(--ok)"; };
 ins.forEach(i => i.addEventListener("input", upd)); upd();
}
qEl.addEventListener("input", e => { tree.innerHTML = navHTML(e.target.value); tree.querySelectorAll(".item").forEach(a => a.classList.toggle("on", a.dataset.id === location.hash.slice(1))); });
tree.addEventListener("click", e => { const b = e.target.closest(".grp>button"); if (b) { const g = b.parentElement; g.classList.toggle("closed"); b.setAttribute("aria-expanded", !g.classList.contains("closed")); } });
document.getElementById("menu").addEventListener("click", () => nav.classList.toggle("open"));
document.addEventListener("click", e => { if (nav.classList.contains("open") && !nav.contains(e.target) && e.target.id !== "menu") nav.classList.remove("open"); });
let tt; function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2000); }
view.addEventListener("click", e => { const b = e.target.closest("button[data-act]"); if (!b) return; if (b.dataset.act === "Upload icon") { const u = view.querySelector("#icoUp"); if (u) { u.click(); return; } } if (b.dataset.act === "Change icon") { const l = view.querySelector("#ilib"); if (l) { l.scrollIntoView({block: "center"}); return; } } toast(`목업 · “${tx(b.dataset.act)}” 기능이 실행될 위치입니다`); });
addEventListener("hashchange", route); route();
</script>
